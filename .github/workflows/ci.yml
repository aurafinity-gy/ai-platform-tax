name: Tax bootstrap checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile source and run synthetic offline tests
        run: |
          python -m compileall -q tax_domain tax_workflow tests
          python -m unittest discover -s tests -v
